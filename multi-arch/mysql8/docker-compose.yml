services:
    mysql:
        image: mysql:8.4
        container_name: mysql-8
        ports:
            - '127.0.0.1:3306:3306'
        restart: on-failure
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
            MYSQL_DATABASE: app_test
            MYSQL_USER: app_user
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
        volumes:
            - 'mysql8-data:/var/lib/mysql'
        healthcheck:
            test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql --protocol=TCP --user=root --execute='SELECT 1'"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
volumes:
    mysql8-data:
